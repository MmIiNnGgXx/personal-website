<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品运营后台</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #667085;
        --line: #d9dee7;
        --accent: #2563eb;
        --green: #0f766e;
        --amber: #b45309;
        --red: #b42318;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); }
      .shell { width: min(1240px, calc(100% - 32px)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; gap: 20px; padding: 28px 0 18px; border-bottom: 1px solid var(--line); }
      h1 { margin: 0; font-size: clamp(34px, 6vw, 64px); line-height: 1; letter-spacing: 0; }
      .lead { max-width: 720px; color: var(--muted); font-size: 17px; line-height: 1.7; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: start; }
      button, input, select { min-height: 38px; border: 1px solid var(--line); border-radius: 6px; padding: 0 12px; background: #fff; color: var(--text); font: inherit; }
      button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 750; cursor: pointer; }
      .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 22px 0; }
      .card, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
      .card { padding: 16px; }
      .card span { color: var(--muted); font-size: 13px; }
      .card strong { display: block; margin-top: 8px; font-size: 28px; line-height: 1; }
      .layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; padding-bottom: 40px; }
      .panel { padding: 16px; }
      h2 { margin: 0 0 14px; font-size: 18px; }
      form { display: grid; gap: 10px; }
      label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; min-width: 760px; border-collapse: collapse; }
      th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; }
      th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
      .badge { display: inline-flex; padding: 4px 8px; border-radius: 999px; background: #e7efff; color: #174ea6; font-size: 12px; font-weight: 750; }
      .badge.good { background: #e7f8f5; color: var(--green); }
      .badge.warn { background: #fff7ed; color: var(--amber); }
      .badge.bad { background: #fff1f0; color: var(--red); }
      .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
      .tab { background: #fff; color: var(--text); border-color: var(--line); }
      .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
      @media (max-width: 920px) {
        header, .layout { grid-template-columns: 1fr; }
        header { flex-direction: column; }
        .metrics { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 560px) {
        .metrics { grid-template-columns: 1fr; }
      }
    
      :root { --bg:#f4f6f7; --text:#202629; --ink:#202629; --muted:#596469; --line:#dde3e5; --accent:#087f75; --blue:#087f75; --accent-soft:#e6f3f0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
      body { font-size:14px; line-height:1.6; }
      .shell { width:min(1440px,calc(100% - 64px)); }
      header { padding:24px 0; align-items:center; gap:20px; }
      h1 { font-size:28px; line-height:1.4; overflow-wrap:anywhere; }
      h2 { font-size:17px; line-height:1.5; }
      h3 { line-height:1.5; }
      .subtitle { display:block; color:var(--muted); font-size:12px; font-weight:400; margin-top:4px; }
      .workspace-nav { display:flex; gap:24px; flex-wrap:wrap; padding:16px 0; border-bottom:1px solid var(--line); }
      .workspace-nav a { color:var(--muted); text-decoration:none; font-size:13px; }
      .workspace-nav a[aria-current="page"] { color:var(--accent); font-weight:700; }
      .panel { border:0; border-radius:0; background:#fff; padding:24px; min-width:0; }
      .metrics,.stats { gap:0; border-bottom:1px solid var(--line); }
      .metrics>.card,.metric,.stat { border:0; border-radius:0; border-right:1px solid var(--line); background:transparent; padding:18px 24px; }
      .metrics>:last-child,.stats>:last-child { border-right:0; }
      .metric strong,.stat strong,.card strong { font-variant-numeric:tabular-nums; }
      .grid,.layout,main { min-width:0; }
      input,select,textarea { min-width:0; font-weight:400; }
      button,.button { font-weight:600; transition:background .15s; }
      button:hover,.button:hover { filter:brightness(.94); }
      button:disabled { opacity:.45; cursor:not-allowed; }
      :focus-visible { outline:3px solid #087f75; outline-offset:3px; }
      th { background:#f5f7f8; white-space:nowrap; text-transform:none; }
      td { overflow-wrap:anywhere; }
      tbody tr:hover { background:#f5faf9; }
      .badge,.chip,.tag { border-radius:4px; }
      .ghost,.move button { background:#e6f3f0; color:#086b62; }
      .bar { border-radius:3px; }
      .area { fill:#e6f3f0; }
      .table-wrap { max-width:100%; }
      @media(max-width:980px) { .shell { width:calc(100% - 32px); } .metrics,.stats { grid-template-columns:repeat(2,minmax(0,1fr)); } }
      @media(max-width:560px) { h1 { font-size:23px; } header { padding:18px 0; } .panel { padding:16px; } .workspace-nav { gap:12px; } .metrics>.card,.metric,.stat { padding:14px 10px; } .metric strong,.stat strong,.card strong { font-size:25px; } }
      @media(prefers-reduced-motion:reduce) { * { transition:none!important; } }

</style>
  </head>
  <body>
    <div class="shell">
<nav class="workspace-nav" aria-label="作品导航"><a href="../../../">徐铭杰 / 作品集</a><a href="../../ai/ai-resume-reviewer/">简历诊断</a><a href="../job-search-dashboard/">求职管理</a><a href="../product-analytics-dashboard/">数据分析</a><a href="../commerce-cms-dashboard/" aria-current="page">商品运营</a></nav>
      <header>
        <div>
          <h1>商品运营后台<span class="subtitle">Commerce Admin</span></h1>
          
        </div>
        <div class="actions">
          <select id="statusFilter" aria-label="订单状态筛选">
            <option value="all">全部订单</option>
            <option value="已支付">已支付</option>
            <option value="待发货">待发货</option>
            <option value="需审核">需审核</option>
          </select>
          <button id="seed">重置示例数据</button>
        </div>
      </header>

      <section class="metrics" aria-label="经营指标">
        <article class="card"><span>订单总额</span><strong id="revenue">$42.6k</strong></article>
        <article class="card"><span>订单</span><strong id="ordersCount">128</strong></article>
        <article class="card"><span>商品</span><strong id="productsCount">6</strong></article>
        <article class="card"><span>库存预警</span><strong id="lowStock">2</strong></article>
      </section>

      <main class="layout">
        <aside class="panel">
          <h2>新增商品</h2>
          <form id="productForm">
            <label>商品名称 <input id="name" required value="日用帆布袋" /></label>
            <label>商品分类 <input id="category" required value="箱包" /></label>
            <label>价格（元） <input id="price" required type="number" min="0" step="0.01" value="68" /></label>
            <label>库存（件） <input id="stock" required type="number" min="0" step="1" value="24" /></label>
            <button>新增商品</button>
          </form>
        </aside>

        <section class="panel">
          <div class="tabs" aria-label="业务视图">
            <button class="tab active" data-view="products">商品</button>
            <button class="tab" data-view="orders">订单</button>
            <button class="tab" data-view="customers">客户</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead id="head"></thead>
              <tbody id="body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script>
      const seedProducts = [
        ["阅读台灯", "家居", 48, 12],
        ["工作椅", "家具", 189, 5],
        ["帆布双肩包", "箱包", 82, 31],
        ["笔记本套装", "文具", 18, 64],
        ["陶瓷杯", "厨具", 22, 3],
        ["无线充电支架", "数码", 54, 7]
      ];
      const orders = [
        ["#1042", "陈晓", "$248", "已支付"],
        ["#1041", "王磊", "$68", "待发货"],
        ["#1040", "林悦", "$411", "需审核"],
        ["#1039", "徐宁", "$126", "已支付"],
        ["#1038", "周芸", "$42", "待发货"]
      ];
      const customers = [
        ["陈晓", "3 笔订单", "$620", "高价值客户"],
        ["王磊", "1 笔订单", "$68", "新客户"],
        ["林悦", "6 笔订单", "$1,420", "需审核"],
        ["徐宁", "2 笔订单", "$318", "复购客户"]
      ];
      let products;
      try { products = JSON.parse(localStorage.getItem("cms-products") || "null") || structuredClone(seedProducts); if(!Array.isArray(products)) throw Error(); } catch { products = structuredClone(seedProducts); }
      const escape = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      let view = "products";

      function badgeClass(value) {
        return value === "需审核" ? "bad" : value === "待发货" || value === "新客户" ? "warn" : "good";
      }

      function render() {
        document.querySelector("#ordersCount").textContent = orders.length;
        document.querySelector("#revenue").textContent = "¥" + orders.reduce((sum, order) => sum + Number(order[2].slice(1)), 0).toLocaleString("zh-CN");
        document.querySelector("#productsCount").textContent = products.length;
        document.querySelector("#lowStock").textContent = products.filter((p) => p[3] <= 7).length;
        document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.view === view));

        if (view === "products") {
          document.querySelector("#head").innerHTML = "<tr><th>商品</th><th>分类</th><th>价格（元）</th><th>库存</th><th>状态</th></tr>";
          document.querySelector("#body").innerHTML = products.map(([name, category, price, stock]) => `
            <tr><td>${escape(name)}</td><td>${escape(category)}</td><td>¥${price}</td><td>${stock}</td><td><span class="badge ${stock <= 7 ? "warn" : "good"}">${stock <= 7 ? "库存不足" : "在售"}</span></td></tr>
          `).join("");
        }

        if (view === "orders") {
          const filter = document.querySelector("#statusFilter").value;
          const visible = filter === "all" ? orders : orders.filter((order) => order[3] === filter);
          document.querySelector("#head").innerHTML = "<tr><th>订单号</th><th>客户</th><th>金额</th><th>状态</th></tr>";
          document.querySelector("#body").innerHTML = visible.map(([id, customer, total, status]) => `
            <tr><td>${id}</td><td>${customer}</td><td>${total}</td><td><span class="badge ${badgeClass(status)}">${status}</span></td></tr>
          `).join("");
        }

        if (view === "customers") {
          document.querySelector("#head").innerHTML = "<tr><th>客户</th><th>订单</th><th>累计消费</th><th>分群</th></tr>";
          document.querySelector("#body").innerHTML = customers.map(([name, count, value, segment]) => `
            <tr><td>${name}</td><td>${count}</td><td>${value}</td><td><span class="badge ${badgeClass(segment)}">${segment}</span></td></tr>
          `).join("");
        }
      }

      document.querySelector("#productForm").addEventListener("submit", (event) => {
        event.preventDefault();
        products.unshift([
          document.querySelector("#name").value,
          document.querySelector("#category").value,
          Number(document.querySelector("#price").value),
          Number(document.querySelector("#stock").value)
        ]);
        localStorage.setItem("cms-products", JSON.stringify(products));
        view = "products";
        render();
      });

      document.querySelector("#statusFilter").addEventListener("change", () => {
        view = "orders";
        render();
      });
      document.querySelector("#seed").addEventListener("click", () => {
        if(!confirm("重置会清除你新增的商品，是否继续？")) return;
        products = structuredClone(seedProducts);
        localStorage.setItem("cms-products", JSON.stringify(products));
        render();
      });
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          view = tab.dataset.view;
          render();
        });
      });

      render();
    </script>
  </body>
</html>
