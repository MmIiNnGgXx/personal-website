<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求职管理工作台 · 徐铭杰作品集</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/cloud.css"><script src="config.js" defer></script><script src="../../shared/cloud.js" defer></script><script src="app.js" defer></script></head>
<body>
<aside class="sidebar">
<a class="brand" href="../../../"><span class="brand-mark"><img src="icons/briefcase-business.svg" alt=""></span><span>求职工作台<small>CAREER WORKSPACE</small></span></a>
<span class="nav-label">我的求职</span>
<nav aria-label="工作区导航"><a href="#jobs" data-view="jobs"><img src="icons/columns-3.svg" alt="">职位管理<span id="navCount">0</span></a><a href="#schedule" data-view="schedule"><img src="icons/calendar-days.svg" alt="">跟进日程<span id="dueCount">0</span></a><a href="#overview" data-view="overview"><img src="icons/layout-dashboard.svg" alt="">求职概览</a></nav>
<div class="sidebar-bottom"><a href="../../ai/ai-resume-reviewer/">简历与岗位诊断 <img src="icons/arrow-right.svg" alt=""></a><a href="../../../">返回作品集 <img src="icons/arrow-left.svg" alt=""></a><div class="account"><span class="avatar">我</span><div>个人工作区<small>数据保存在此浏览器</small></div></div></div>
</aside>
<div class="workspace">
<header class="topbar"><span>个人工作区 <span class="slash">/</span> <strong id="breadcrumb">职位管理</strong></span><span id="today" class="muted"></span></header>
<main>
<div class="pagehead"><div><span class="eyebrow" id="eyebrow">OPPORTUNITIES</span><h1 id="pageTitle">职位管理</h1><div class="cloud-status" data-cloud-status></div></div><div class="head-actions"><button class="icon-button" data-action="import" title="导入备份" aria-label="导入备份"><img src="icons/upload.svg" alt=""></button><button class="icon-button" data-action="export" title="导出备份" aria-label="导出备份"><img src="icons/download.svg" alt=""></button><button class="primary" data-action="new"><img src="icons/plus.svg" alt="">新增职位</button></div></div>
<input type="file" id="importFile" accept=".json,.csv,application/json,text/csv" hidden>
<section class="stats" aria-label="求职统计"><div><span>全部职位</span><strong id="total">0</strong><small id="activeCount"></small></div><div><span>面试中</span><strong id="interviews" class="text-blue">0</strong><small>当前面试阶段</small></div><div><span>已获录用</span><strong id="offers" class="text-green">0</strong><small>当前录用阶段</small></div><div><span>有进展比例</span><strong id="rate">0%</strong><small>面试或录用 / 已投递职位</small></div></section>
<section id="jobsView">
<div class="toolbar"><label class="search"><img src="icons/search.svg" alt=""><input id="search" placeholder="搜索公司、岗位或城市" aria-label="搜索公司或岗位"></label><select id="stageFilter" aria-label="筛选阶段"><option value="">全部阶段</option></select><select id="priorityFilter" aria-label="筛选优先级"><option value="">全部优先级</option><option value="high">高优先级</option><option value="normal">中优先级</option><option value="low">低优先级</option></select><select id="sort" aria-label="排序"><option value="created">最近添加</option><option value="priority">优先级优先</option><option value="deadline">跟进日期优先</option></select><div class="view-switch" role="group" aria-label="显示方式"><button class="icon-button active" data-action="board" aria-label="看板视图" title="看板视图" aria-pressed="true"><img src="icons/columns-3.svg" alt=""></button><button class="icon-button" data-action="list" aria-label="列表视图" title="列表视图" aria-pressed="false"><img src="icons/list.svg" alt=""></button></div></div>
<div class="result-line"><span id="resultCount"></span><button class="text-button" id="clearFilters" data-action="clear" hidden>清除筛选</button></div>
<div class="board" id="board" aria-label="投递阶段看板"></div><div class="table-wrap" id="jobTable" hidden><table><thead><tr><th>公司 / 岗位</th><th>城市</th><th>薪资</th><th>阶段</th><th>优先级</th><th>下次跟进</th><th>操作</th></tr></thead><tbody id="jobRows"></tbody></table></div>
</section>
<section id="scheduleView" hidden><div class="section-head"><h2>待办与面试</h2><select id="scheduleFilter" aria-label="日程范围"><option value="all">全部待办</option><option value="today">今天</option><option value="overdue">已逾期</option><option value="week">未来七天</option></select></div><div id="scheduleList"></div></section>
<section id="overviewView" hidden><div class="overview-grid"><section><div class="section-head"><h2>投递阶段分布</h2><span class="muted">当前快照</span></div><div id="stageChart"></div></section><section><div class="section-head"><h2>优先跟进</h2><span class="muted">未完成事项</span></div><div id="focusList"></div></section></div><section class="activity-section"><div class="section-head"><h2>最近动态</h2></div><div id="activityList"></div></section></section>
</main></div>
<dialog id="editor" aria-labelledby="editorTitle"><form id="form"><div class="dialog-head"><div><span class="eyebrow">OPPORTUNITY</span><h2 id="editorTitle">新增职位</h2></div><button type="button" class="icon-button" data-action="close-editor" aria-label="关闭表单" title="关闭表单"><img src="icons/x.svg" alt=""></button></div>
<div class="form-grid"><label>公司名称 <input id="company" required maxlength="100" placeholder="真实公司名称"></label><label>应聘岗位 <input id="role" required maxlength="100" placeholder="例如：前端开发工程师"></label><label>城市 <input id="city" maxlength="60" placeholder="例如：厦门 / 远程"></label><label>薪资范围 <input id="salary" maxlength="60" placeholder="例如：10–15K · 13薪"></label><label>投递阶段 <select id="status"></select></label><label>优先级 <select id="priority"><option value="normal">中优先级</option><option value="high">高优先级</option><option value="low">低优先级</option></select></label><label class="wide">职位链接 <input id="sourceUrl" type="url" maxlength="1000" placeholder="https://..."></label><label class="wide">岗位描述（JD） <textarea id="description" maxlength="30000" rows="5" placeholder="粘贴真实岗位职责和要求"></textarea></label><label class="wide">下次跟进 <input id="next" maxlength="240" placeholder="例如：发送作品集，确认面试安排"></label><label>跟进日期 <input id="deadline" type="date"></label><label>投递渠道 <input id="source" maxlength="60" placeholder="例如：官网 / 内推"></label><label class="wide">职位备注 <textarea id="notes" maxlength="4000" rows="4" placeholder="记录沟通要点或准备事项"></textarea></label></div>
<div id="formError" role="alert" class="error"></div><div class="dialog-actions"><button type="button" data-action="close-editor">取消</button><button class="primary" type="submit">保存职位</button></div></form></dialog>
<dialog id="detail" class="drawer" aria-labelledby="detailTitle"><div class="dialog-head"><span class="eyebrow">OPPORTUNITY DETAILS</span><button class="icon-button" data-action="close-detail" aria-label="关闭详情" title="关闭详情"><img src="icons/x.svg" alt=""></button></div><div id="detailBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
