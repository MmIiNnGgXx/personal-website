<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Analytics Dashboard</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #667085;
        --line: #d9dee7;
        --accent: #2563eb;
        --green: #0f766e;
        --amber: #b45309;
        --red: #b42318;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); }
      .shell { width: min(1240px, calc(100% - 32px)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; gap: 20px; padding: 28px 0 18px; border-bottom: 1px solid var(--line); }
      h1 { margin: 0; font-size: clamp(34px, 6vw, 64px); line-height: 1; letter-spacing: 0; }
      .lead { max-width: 720px; color: var(--muted); font-size: 17px; line-height: 1.7; }
      .toolbar { display: flex; align-items: start; gap: 8px; flex-wrap: wrap; }
      select, button { min-height: 38px; border: 1px solid var(--line); border-radius: 6px; padding: 0 12px; background: #fff; color: var(--text); font: inherit; }
      button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 750; cursor: pointer; }
      .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 22px 0; }
      .card, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
      .card { padding: 16px; }
      .card span { color: var(--muted); font-size: 13px; }
      .card strong { display: block; margin-top: 8px; font-size: 30px; line-height: 1; }
      .delta { margin-top: 10px; color: var(--green); font-size: 13px; font-weight: 700; }
      .grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.65fr); gap: 16px; padding-bottom: 16px; }
      .panel { padding: 16px; }
      h2 { margin: 0 0 14px; font-size: 18px; }
      .chart { width: 100%; height: 260px; display: block; }
      .axis { stroke: #d9dee7; stroke-width: 1; }
      .line { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .area { fill: #e7efff; }
      .funnel { display: grid; gap: 10px; }
      .funnel-row { display: grid; gap: 6px; }
      .funnel-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
      .bar { height: 14px; border-radius: 999px; background: #edf1f7; overflow: hidden; }
      .bar span { display: block; height: 100%; background: var(--accent); }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; min-width: 720px; }
      th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; }
      th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
      .badge { display: inline-flex; padding: 4px 8px; border-radius: 999px; background: #e7efff; color: #174ea6; font-size: 12px; font-weight: 750; }
      .badge.warn { background: #fff7ed; color: var(--amber); }
      .badge.good { background: #e7f8f5; color: var(--green); }
      @media (max-width: 920px) {
        header { flex-direction: column; }
        .metrics, .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <h1>Product Analytics Dashboard</h1>
          <p class="lead">一个产品数据工作台，把增长、激活、转化漏斗、留存和事件明细放在可扫描的界面里。</p>
        </div>
        <div class="toolbar" aria-label="Dashboard filters">
          <select id="segment">
            <option>All users</option>
            <option>New users</option>
            <option>Returning users</option>
          </select>
          <select id="range">
            <option>Last 30 days</option>
            <option>Last 7 days</option>
            <option>This quarter</option>
          </select>
          <button id="refresh">Refresh</button>
        </div>
      </header>

      <section class="metrics" aria-label="Key metrics">
        <article class="card"><span>Visitors</span><strong id="visitors">42.8k</strong><div class="delta">+12.4%</div></article>
        <article class="card"><span>Signups</span><strong id="signups">3,842</strong><div class="delta">+8.1%</div></article>
        <article class="card"><span>Activation</span><strong id="activation">48%</strong><div class="delta">+5.6%</div></article>
        <article class="card"><span>Paid Conversion</span><strong id="conversion">7.2%</strong><div class="delta">+1.3%</div></article>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>Activation Trend</h2>
          <svg class="chart" viewBox="0 0 680 260" role="img" aria-label="Activation trend chart">
            <path class="axis" d="M40 215H650M40 40V215" />
            <path class="area" d="M40 190L130 172L220 158L310 150L400 122L490 104L580 92L650 76V215H40Z" />
            <path class="line" d="M40 190L130 172L220 158L310 150L400 122L490 104L580 92L650 76" />
            <g fill="#2563eb">
              <circle cx="40" cy="190" r="5" /><circle cx="130" cy="172" r="5" /><circle cx="220" cy="158" r="5" />
              <circle cx="310" cy="150" r="5" /><circle cx="400" cy="122" r="5" /><circle cx="490" cy="104" r="5" />
              <circle cx="580" cy="92" r="5" /><circle cx="650" cy="76" r="5" />
            </g>
          </svg>
        </article>

        <article class="panel">
          <h2>Conversion Funnel</h2>
          <div class="funnel" id="funnel"></div>
        </article>
      </section>

      <section class="panel">
        <h2>Recent Product Events</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Event</th><th>Segment</th><th>Count</th><th>Change</th><th>Status</th></tr>
            </thead>
            <tbody id="events"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script>
      const funnels = [
        ["Visited landing", 100],
        ["Started onboarding", 62],
        ["Created project", 48],
        ["Invited teammate", 22],
        ["Upgraded", 7]
      ];
      const events = [
        ["signup_completed", "New users", "3,842", "+8.1%", "Healthy"],
        ["project_created", "Activated", "1,846", "+5.6%", "Healthy"],
        ["invite_sent", "Teams", "812", "-2.4%", "Watch"],
        ["checkout_started", "Trial users", "420", "+1.9%", "Healthy"],
        ["export_report", "Power users", "268", "+14.2%", "High intent"]
      ];

      function render() {
        document.querySelector("#funnel").innerHTML = funnels.map(([label, value]) => `
          <div class="funnel-row">
            <div class="funnel-label"><span>${label}</span><strong>${value}%</strong></div>
            <div class="bar"><span style="width:${value}%"></span></div>
          </div>
        `).join("");

        document.querySelector("#events").innerHTML = events.map(([event, segment, count, change, status]) => {
          const cls = status === "Watch" ? "warn" : status === "High intent" ? "good" : "";
          return `<tr><td>${event}</td><td>${segment}</td><td>${count}</td><td>${change}</td><td><span class="badge ${cls}">${status}</span></td></tr>`;
        }).join("");
      }

      document.querySelector("#refresh").addEventListener("click", () => {
        document.querySelector("#conversion").textContent = `${(6.8 + Math.random() * 1.2).toFixed(1)}%`;
      });

      render();
    </script>
  </body>
</html>
